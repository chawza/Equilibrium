# ── Keyboard Shortcuts dialog ────────────────────────────────────────────────

[[step]]
name = "open Keyboard Shortcuts via View"
action = "eval"
script = '''
var b = Array.from(document.querySelectorAll('main button')).find(function (x) {
  return x.textContent && x.textContent.trim() === 'View';
});
if (!b) throw new Error('Keyboard Shortcuts View button not found');
b.click();
'ok'
'''

[[step]]
name = "wait for Keyboard Shortcuts dialog"
action = "wait"
selector = '[role="dialog"]'
timeout_ms = 5000

[[step]]
name = "Keyboard Shortcuts dialog content"
action = "eval"
script = '''
var d = document.querySelector('[role="dialog"]');
if (!d || !(d.textContent || '').includes('Keyboard Shortcuts')) throw new Error('Keyboard Shortcuts content missing');
'ok'
'''

[[step]]
name = "close Keyboard Shortcuts"
action = "click"
target = '[aria-label="Close keyboard shortcuts"]'

[[step]]
name = "wait for dialog to close"
action = "wait"
selector = '[role="dialog"]'
gone = true
timeout_ms = 5000
