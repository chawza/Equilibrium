# Scenario 06 -- Balance Bar Over-Budget
# Outflow > inflow -> destructive color, glow, "over budget" footer.
# Fixture: budget 1 with inflow 50.000, outflow 80.000.

[scenario]
name = "06 Balance Over-Budget"

[[step]]
name = "navigate to budget form"
action = "navigate"
url = "http://localhost:5173/budget/1"

[[step]]
name = "wait for DOM to settle"
action = "watch"
require_mutation = true
timeout_ms = 8000
stable = 500

[[step]]
name = "wait for budget form"
action = "wait"
selector = "[aria-label=\"Add inflow record\"]"
timeout_ms = 5000

[[step]]
name = "assert balance negative"
action = "eval"
script = "var text = document.querySelector('main').textContent || ''; if (!text.includes('−30.000') && !text.includes('-30.000')) throw new Error('Expected negative balance -30.000, got: ' + text.substring(0, 300));"

[[step]]
name = "assert over budget footer text"
action = "eval"
script = "var text = document.querySelector('main').textContent || ''; if (!text.includes('over budget')) throw new Error('Expected over budget text in footer');"

[[step]]
name = "take screenshot"
action = "screenshot"
selector = "main"
path = "e2e/screenshots/06-over-budget.png"
