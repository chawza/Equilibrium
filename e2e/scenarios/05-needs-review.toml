# Scenario 05 -- "Needs Review" Badge
# Client-side amber badge on active budgets past end_date. Must not appear on closed budgets.
# Fixture: budget 1 = active, past end_date; budget 2 = closed, past end_date.

[scenario]
name = "05 Needs Review Badge"

[[step]]
name = "navigate to dashboard"
action = "navigate"
url = "http://localhost:5173/"

[[step]]
name = "wait for DOM to settle"
action = "watch"
require_mutation = true
timeout_ms = 8000
stable = 500

[[step]]
name = "assert Needs review badge visible on expired active"
action = "eval"
script = "var text = document.querySelector('main').textContent || ''; if (!text.includes('Needs review')) throw new Error('Needs review badge not found for expired active budget'); if (!text.includes('ended')) throw new Error('Ended hint not found');"

[[step]]
name = "assert closed card has no Needs review badge"
action = "eval"
script = "var cards = Array.from(document.querySelectorAll('main [role=\"button\"]')); for (var i = 0; i < cards.length; i++) { if (cards[i].textContent.includes('closed') && cards[i].textContent.includes('Needs review')) throw new Error('Closed card incorrectly shows Needs review badge'); }"

[[step]]
name = "take screenshot"
action = "screenshot"
selector = "main"
path = "e2e/screenshots/05-needs-review.png"
