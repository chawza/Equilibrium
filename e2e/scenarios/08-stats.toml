# Scenario 08 -- Stats Page
# Loaded with seeded.sql (6 budgets, multi-lifecycle).
# Verify tiles, bars, tag selector.

[scenario]
name = "08 Stats Page"

[[step]]
name = "navigate to stats"
action = "navigate"
url = "http://localhost:5173/stats"

[[step]]
name = "wait for DOM to settle"
action = "watch"
require_mutation = true
timeout_ms = 8000
stable = 500

[[step]]
name = "assert stats page has content"
action = "eval"
script = "var text = document.querySelector('main').textContent || ''; if (!text.includes('Rp')) throw new Error('Stats page has no currency data'); if (!text.includes('Inflow vs') && !text.includes('Breakdown by Tag')) throw new Error('Stats charts not found');"

[[step]]
name = "take screenshot"
action = "screenshot"
selector = "main"
path = "e2e/screenshots/08-stats.png"
