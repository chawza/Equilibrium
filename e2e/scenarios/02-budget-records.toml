# Scenario 02 -- Budget Records
# Add inflow + outflow, balance updates, amounts formatted with dot-separator.
# Fixture pre-loads budget id=1 (active, current month).

[scenario]
name = "02 Budget Records"

[[step]]
name = "navigate to budget form"
action = "navigate"
url = "http://localhost:5173/budget/1"

[[step]]
name = "wait for DOM to settle"
action = "watch"
require_mutation = true
timeout_ms = 8000
stable = 500

[[step]]
name = "wait for T-account columns"
action = "wait"
selector = "[aria-label=\"Add inflow record\"]"
timeout_ms = 5000

[[step]]
name = "click add inflow placeholder"
action = "eval"
script = "var btns = Array.from(document.querySelectorAll('main button')); var add = btns.find(function(b) { return b.textContent && b.textContent.includes('Add inflow'); }); if (add) add.click(); else throw new Error('Add inflow button not found');"

[[step]]
name = "wait for edit mode"
action = "wait"
selector = "input[inputmode=\"numeric\"]"
timeout_ms = 5000

[[step]]
name = "fill amount 100000"
action = "fill"
target = "input[inputmode=\"numeric\"]"
value = "100000"

[[step]]
name = "press enter to save inflow"
action = "press"
key = "Enter"

[[step]]
name = "wait for save to complete"
action = "watch"
require_mutation = true
timeout_ms = 5000
stable = 500

[[step]]
name = "assert inflow total 100.000"
action = "eval"
script = "var text = document.querySelector('main').textContent || ''; if (!text.includes('100.000')) throw new Error('Expected 100.000 in page, not found');"

[[step]]
name = "click add outflow placeholder"
action = "eval"
script = "var btns = Array.from(document.querySelectorAll('main button')); var add = btns.find(function(b) { return b.textContent && b.textContent.includes('Add outflow'); }); if (add) add.click(); else throw new Error('Add outflow button not found');"

[[step]]
name = "wait for edit mode outflow"
action = "wait"
selector = "input[inputmode=\"numeric\"]"
timeout_ms = 5000

[[step]]
name = "fill amount 40000"
action = "fill"
target = "input[inputmode=\"numeric\"]"
value = "40000"

[[step]]
name = "press enter to save outflow"
action = "press"
key = "Enter"

[[step]]
name = "wait for save to complete"
action = "watch"
require_mutation = true
timeout_ms = 5000
stable = 500

[[step]]
name = "assert outflow total 40.000"
action = "eval"
script = "var text = document.querySelector('main').textContent || ''; if (!text.includes('40.000')) throw new Error('Expected 40.000 in page, not found');"

[[step]]
name = "assert balance 60.000"
action = "eval"
script = "var text = document.querySelector('main').textContent || ''; if (!text.includes('60.000') && !text.includes('+60.000')) throw new Error('Expected balance 60.000 in page, not found');"

[[step]]
name = "take screenshot"
action = "screenshot"
selector = "main"
path = "e2e/screenshots/02-budget-records.png"
